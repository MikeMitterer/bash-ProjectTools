[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmit-projecttools"
version = "0.1.0"
description = "Shared Python helpers for ProjectTools command-line tools"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["projecttools", "projecttools.*"]
namespaces = false
